<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>My Vocab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@300;400;500;600&display=swap');
:root{--bg:#0d0d0f;--sf:#16161a;--sf2:#1e1e24;--br:#2a2a33;--ac:#e8c96d;--ac2:#7eb8f7;--ac3:#f07fa0;--ac4:#8adfb4;--tx:#f0eff4;--mu:#888899;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--tx);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden;}
.hdr{padding:16px 18px 0;text-align:center;position:sticky;top:0;background:var(--bg);z-index:100;border-bottom:1px solid var(--br);}
.hdr h1{font-family:'Playfair Display',serif;font-size:23px;color:var(--ac);letter-spacing:1px;margin-bottom:1px;}
.hdr p{font-size:10.5px;color:var(--mu);margin-bottom:9px;}
.tabs{display:flex;background:var(--sf);border-radius:9px 9px 0 0;overflow:hidden;margin:0 -18px;}
.tb{flex:1;padding:10px 3px;background:none;border:none;color:var(--mu);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:500;cursor:pointer;transition:all .2s;position:relative;}
.tb.on{color:var(--ac);background:var(--sf2);}
.tb.on::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--ac);}
.badge{display:inline-block;background:var(--ac3);color:#fff;font-size:8.5px;border-radius:8px;padding:1px 5px;margin-left:2px;vertical-align:middle;font-weight:700;}
.pnl{display:none;}.pnl.on{display:block;}
.ctrl{padding:10px 14px;display:flex;gap:7px;align-items:center;background:var(--bg);position:sticky;top:113px;z-index:90;border-bottom:1px solid var(--br);}
.ctrl input{flex:1;background:var(--sf);border:1px solid var(--br);border-radius:9px;padding:7px 11px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;outline:none;}
.ctrl input::placeholder{color:var(--mu);}
.ctrl input:focus{border-color:var(--ac);}
.btn{background:var(--sf2);border:1px solid var(--br);border-radius:9px;padding:7px 11px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:11.5px;font-weight:500;cursor:pointer;white-space:nowrap;}
.btn:active{transform:scale(.96);}
.btn.a{background:var(--ac);color:#0d0d0f;border-color:var(--ac);font-weight:700;}
.btn.g{background:var(--ac4);color:#0d0d0f;border-color:var(--ac4);font-weight:700;}
.pi{padding:6px 14px;display:flex;justify-content:space-between;align-items:center;font-size:10.5px;color:var(--mu);}
.pnav{display:flex;gap:5px;align-items:center;}
.pnav button{background:var(--sf);border:1px solid var(--br);border-radius:7px;padding:3px 9px;color:var(--tx);font-size:11px;cursor:pointer;}
.pnav button:disabled{opacity:.3;cursor:default;}
.pnd{font-size:11.5px;color:var(--ac);font-weight:700;min-width:44px;text-align:center;}
.wl{padding:8px 13px 40px;}
.wc{background:var(--sf);border:1px solid var(--br);border-radius:13px;margin-bottom:8px;overflow:hidden;}
.wc:active{transform:scale(.99);}
.ch{display:flex;align-items:center;padding:12px 13px;cursor:pointer;gap:9px;}
.wi{flex:1;min-width:0;}
.wtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
.wen{font-family:'Playfair Display',serif;font-size:20px;color:var(--tx);}
.wpron{font-size:11px;color:var(--ac2);font-family:monospace;margin-top:2px;}
.wko{font-size:13px;color:var(--ac);font-weight:600;margin-top:3px;}
.wpos{font-size:9.5px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;}

.ca{display:flex;gap:5px;align-items:center;flex-shrink:0;}
.sbtn{background:var(--sf2);border:1px solid var(--br);border-radius:7px;padding:5px 8px;font-size:15px;cursor:pointer;}
.sbtn:active{background:var(--ac2);border-color:var(--ac2);}
.vbtn{background:none;border:1.5px solid var(--br);border-radius:7px;padding:5px 8px;font-size:15px;cursor:pointer;}
.vbtn.sv{border-color:var(--ac2);background:rgba(126,184,247,.1);}
.ei{color:var(--mu);font-size:11px;transition:transform .2s;}
.wc.ex .ei{transform:rotate(180deg);}
.cd{display:none;padding:0 13px 13px;border-top:1px solid var(--br);}
.wc.ex .cd{display:block;}
.ds{margin-top:10px;}
.dl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:var(--mu);margin-bottom:4px;}
.nb{background:rgba(232,201,109,.07);border:1px solid rgba(232,201,109,.2);border-radius:9px;padding:9px 11px;font-size:12px;color:#d4b85a;line-height:1.65;}
.sg{display:flex;flex-direction:column;gap:4px;}
.sr{display:flex;gap:7px;align-items:flex-start;}
.sc{background:rgba(138,223,180,.1);border:1px solid rgba(138,223,180,.22);color:var(--ac4);font-size:11px;font-weight:600;padding:2px 8px;border-radius:7px;white-space:nowrap;flex-shrink:0;}
.sm{font-size:11px;color:var(--mu);line-height:1.5;padding-top:2px;}
.exb{font-size:12.5px;color:var(--tx);line-height:1.65;padding:7px 10px;background:var(--sf2);border-radius:8px;border-left:3px solid var(--ac);margin-bottom:4px;}
.exb em{color:var(--ac);font-style:normal;font-weight:700;}
.exko{font-size:10.5px;color:var(--mu);margin-top:2px;}
.rc{display:flex;flex-wrap:wrap;gap:4px;}
.rch{background:rgba(126,184,247,.08);border:1px solid rgba(126,184,247,.18);color:var(--ac2);font-size:10.5px;padding:2px 8px;border-radius:6px;}
.se{text-align:center;padding:50px 18px;color:var(--mu);}
.se .ic{font-size:44px;margin-bottom:10px;}
.svc{padding:10px 14px 0;display:flex;justify-content:flex-end;}
.svl{padding:8px 13px 40px;}
.qc{padding:16px;}
.qsetup{text-align:center;padding:14px 0;}
.qsetup h2{font-family:'Playfair Display',serif;font-size:21px;color:var(--ac);margin-bottom:7px;}
.qsetup p{font-size:12.5px;color:var(--mu);margin-bottom:18px;line-height:1.6;}
.qm{display:flex;flex-direction:column;gap:9px;}
.qcard{background:var(--sf);border:1px solid var(--br);border-radius:14px;padding:24px 16px 18px;text-align:center;margin-bottom:13px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.qpt{font-size:10.5px;color:var(--mu);margin-bottom:4px;}
.qw{font-family:'Playfair Display',serif;font-size:25px;color:var(--tx);margin-bottom:3px;line-height:1.3;}
.qsub{font-size:10.5px;color:var(--mu);text-transform:uppercase;letter-spacing:1px;}
.qopts{display:flex;flex-direction:column;gap:8px;}
.qob{background:var(--sf);border:1.5px solid var(--br);border-radius:11px;padding:12px 15px;color:var(--tx);font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;text-align:left;transition:all .2s;}
.qob.ok{border-color:#4cde80;background:rgba(76,222,128,.1);color:#4cde80;}
.qob.no{border-color:var(--ac3);background:rgba(240,127,160,.1);color:var(--ac3);}
.qres{background:var(--sf);border-radius:14px;padding:26px 16px;text-align:center;}
.qres .qsc{font-family:'Playfair Display',serif;font-size:50px;color:var(--ac);line-height:1;}
.pb{height:3px;background:var(--br);border-radius:3px;margin-bottom:14px;overflow:hidden;}
.pf{height:100%;background:var(--ac);border-radius:3px;transition:width .3s;}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.wc{animation:fi .18s ease both;}


.diff-stars{display:inline-flex;gap:1px;align-items:center;margin-left:4px;}
.diff-stars span{font-size:11px;line-height:1;}
.diff1{color:#8adfb4;}
.diff2{color:#e8c96d;}
.diff3{color:#f07fa0;}
.diff-filter{padding:6px 14px;display:flex;gap:6px;background:var(--bg);border-bottom:1px solid var(--br);overflow-x:auto;}
.df-btn{background:var(--sf2);border:1px solid var(--br);border-radius:8px;padding:5px 11px;color:var(--mu);font-size:11px;cursor:pointer;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.df-btn.on{border-color:var(--ac);color:var(--ac);background:rgba(232,201,109,.1);}
.df-btn.on1{border-color:#8adfb4;color:#8adfb4;background:rgba(138,223,180,.1);}
.df-btn.on2{border-color:#e8c96d;color:#e8c96d;background:rgba(232,201,109,.1);}
.df-btn.on3{border-color:#f07fa0;color:#f07fa0;background:rgba(240,127,160,.1);}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg);}::-webkit-scrollbar-thumb{background:var(--br);border-radius:4px;}
</style>
</head>
<body>
<div class="hdr">
  <h1>✦ My Vocab</h1>
  <p>중급 영어 단어장 · 10개씩 학습 · 발음 소리 지원</p>
  <div class="tabs">
    <button class="tb on" onclick="sw('vocab')">📖 단어장</button>
    <button class="tb" onclick="sw('saved')">⭐ 저장 <span class="badge" id="sc0">0</span></button>
    <button class="tb" onclick="sw('quiz')">✏️ 퀴즈</button>
  </div>
</div>

<div class="pnl on" id="pnl-vocab">
  <div class="ctrl">
    <input type="search" id="srch" placeholder="단어 검색..." oninput="onSrch()">
    <button class="btn a" onclick="doShuffle()">🔀 섞기</button>
    <button class="btn g" onclick="nxt()">다음 10개 →</button>
  </div>
  <div class="diff-filter">
    <button class="df-btn on" id="df0" onclick="setDiff(0)">전체</button>
    <button class="df-btn" id="df1" onclick="setDiff(1)">★☆☆ 중급</button>
    <button class="df-btn" id="df2" onclick="setDiff(2)">★★☆ 고급</button>
    <button class="df-btn" id="df3" onclick="setDiff(3)">★★★ 최고급</button>
  </div>
  <div class="pi">
    <span id="plbl"></span>
    <div class="pnav">
      <button onclick="prv()" id="pbtn">← 이전</button>
      <span class="pnd" id="pnd"></span>
      <button onclick="nxt()" id="nbtn">다음 →</button>
    </div>
  </div>
  <div class="wl" id="wl"></div>
</div>

<div class="pnl" id="pnl-saved">
  <div class="svc"><button class="btn" onclick="clrAll()">🗑️ 전체 삭제</button></div>
  <div class="svl" id="svl"></div>
</div>

<div class="pnl" id="pnl-quiz">
  <div class="qc" id="qc"></div>
</div>

<script>

 syn:[{s:"give up",m:"노력을 멈추고 포기하다 (가장 일반적)"},{s:"desert",m:"사람이나 장소를 무책임하게 버리다"},{s:"forsake",m:"문어체. 사랑하는 대상을 저버리다"},{s:"relinquish",m:"권리나 통제권을 공식적으로 내려놓다"}],

{w:"fill in",pron:"/{fɪl ɪn/",ko:"채우다; 대신하다; 정보를 알려주다",pos:"phr.v",ph:true,
 diff:1,

{w:"fill up",pron:"/{fɪl ʌp/",ko:"가득 채우다; 배부르다",pos:"phr.v",ph:true,
 diff:1,
 nu:"공간·탱크 등을 가득 채우거나, 식사로 배를 채우는 것.",

{w:"point out",pron:"/{pɔɪnt aʊt/",ko:"지적하다; 알려주다",pos:"phr.v",ph:true,

{w:"back away",pron:"/{bæk əˈweɪ/",ko:"물러서다; 후퇴하다",pos:"phr.v",ph:true,

 ex:[{en:"<em>Back away</em> slowly — there's a bee.",ko:"천천히 물러서, 벌이 있어."},{en:"He <em>backed away</em> from his earlier statement.",ko:"그는 앞서 한 발언에서 물러섰다."}]}

];

const PS=10;
let pool=[...W];
let filt=[];
let pg=0;
let saved=new Set(JSON.parse(localStorage.getItem('mv3')||'[]'));

function save(){localStorage.setItem('mv3',JSON.stringify([...saved]));document.getElementById('sc0').textContent=saved.size;}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function pages(){return Math.max(1,Math.ceil(filt.length/PS));}


function diffStar(d){
  const cls=['','diff1','diff2','diff3'];
  const filled=d||1;
  let s='<span class="diff-stars">';
  for(let i=1;i<=3;i++) s+=`<span class="${i<=filled?cls[filled]:''}">` + (i<=filled?'★':'☆') + '</span>';
  return s+'</span>';
}

let curDiff=0;
function setDiff(d){
  curDiff=d;
  [0,1,2,3].forEach(i=>{
    const btn=document.getElementById('df'+i);
    if(!btn)return;
    btn.className='df-btn'+(i===d?(d===0?' on':' on on'+d):'');
  });
  filt=curDiff?pool.filter(w=>w.diff===curDiff):[...pool];
  const q=document.getElementById('srch').value.toLowerCase().trim();
  if(q) filt=filt.filter(w=>w.w.toLowerCase().includes(q)||w.ko.includes(q)||w.syn.some(s=>s.s.toLowerCase().includes(q)));
  pg=0;rdr();
}

function rdr(){
  const words=filt.slice(pg*PS,(pg+1)*PS);
  document.getElementById('wl').innerHTML=words.map((w,i)=>{
    const sv=saved.has(w.w);
    return`<div class="wc" id="c${i}" style="animation-delay:${i*.04}s">
      <div class="ch" onclick="tog('c${i}')">
        <div class="wi">
          <div class="wtop"><span class="wen">${w.w}</span>${diffStar(w.diff)}</div>
          <div class="wpron">${w.pron}</div>
          <div class="wko">${w.ko}</div>
          <div class="wpos">${w.pos}</div>
        </div>
        <div class="ca">
          <button class="sbtn" onclick="spk(event,'${w.w}')" title="발음 듣기">🔊</button>
          <button class="vbtn${sv?' sv':''}" onclick="tgSv(event,'${w.w}')">${sv?'⭐':'☆'}</button>
          <span class="ei">▼</span>
        </div>
      </div>
      <div class="cd">
        <div class="ds"><div class="dl">💡 뉘앙스 &amp; 쓰임새</div><div class="nb">${w.nu}</div></div>
        <div class="ds"><div class="dl">🔄 동의어 (해석 포함)</div><div class="sg">${w.syn.map(s=>`<div class="sr"><span class="sc">${s.s}</span><span class="sm">${s.m}</span></div>`).join('')}</div></div>
        <div class="ds"><div class="dl">📝 예문 1</div><div class="exb">${w.ex[0].en}<div class="exko">${w.ex[0].ko}</div></div></div>
        <div class="ds"><div class="dl">📝 예문 2</div><div class="exb">${w.ex[1].en}<div class="exko">${w.ex[1].ko}</div></div></div>
        ${w.rel?`<div class="ds"><div class="dl">🔗 관련 표현</div><div class="rc">${w.rel.map(r=>`<span class="rch">${r}</span>`).join('')}</div></div>`:''}
      </div>
    </div>`;
  }).join('');
  const tot=pages(),cur=pg+1;
  document.getElementById('plbl').textContent=`${filt.length}개 중 ${pg*PS+1}~${Math.min((pg+1)*PS,filt.length)}번째`;
  document.getElementById('pnd').textContent=`${cur} / ${tot}`;
  document.getElementById('pbtn').disabled=pg===0;
  document.getElementById('nbtn').disabled=pg>=tot-1;
  window.scrollTo({top:0,behavior:'smooth'});
}

function tog(id){document.getElementById(id).classList.toggle('ex');}
function spk(e,w){e.stopPropagation();const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}
function tgSv(e,w){e.stopPropagation();saved.has(w)?saved.delete(w):saved.add(w);save();rdr();}
function onSrch(){const q=document.getElementById('srch').value.toLowerCase().trim();let base=curDiff?pool.filter(w=>w.diff===curDiff):[...pool];filt=q?base.filter(w=>w.w.toLowerCase().includes(q)||w.ko.includes(q)||w.syn.some(s=>s.s.toLowerCase().includes(q))):base;pg=0;rdr();}
function doShuffle(){shuf(pool);filt=[...pool];pg=0;document.getElementById('srch').value='';rdr();}
function nxt(){if(pg<pages()-1){pg++;rdr();}}
function prv(){if(pg>0){pg--;rdr();}}

function rdrSaved(){
  const svl=document.getElementById('svl');
  const words=W.filter(w=>saved.has(w.w));
  if(!words.length){svl.innerHTML='<div class="se"><div class="ic">⭐</div><p>저장된 단어가 없습니다.<br>단어장에서 ☆를 눌러 저장하세요.</p></div>';return;}
  svl.innerHTML=words.map((w,i)=>`<div class="wc" id="s${i}" style="animation-delay:${i*.04}s">
    <div class="ch" onclick="tog('s${i}')">
      <div class="wi">
        <div class="wtop"><span class="wen">${w.w}</span>${diffStar(w.diff)}</div>
        <div class="wpron">${w.pron}</div>
        <div class="wko">${w.ko}</div>
        <div class="wpos">${w.pos}</div>
      </div>
      <div class="ca">
        <button class="sbtn" onclick="spk(event,'${w.w}')">🔊</button>
        <button class="vbtn sv" onclick="rmSv(event,'${w.w}')">⭐</button>
        <span class="ei">▼</span>
      </div>
    </div>
    <div class="cd">
      <div class="ds"><div class="dl">💡 뉘앙스</div><div class="nb">${w.nu}</div></div>
      <div class="ds"><div class="dl">🔄 동의어</div><div class="sg">${w.syn.map(s=>`<div class="sr"><span class="sc">${s.s}</span><span class="sm">${s.m}</span></div>`).join('')}</div></div>
      <div class="ds"><div class="dl">📝 예문 1</div><div class="exb">${w.ex[0].en}<div class="exko">${w.ex[0].ko}</div></div></div>
      <div class="ds"><div class="dl">📝 예문 2</div><div class="exb">${w.ex[1].en}<div class="exko">${w.ex[1].ko}</div></div></div>
      ${w.rel?`<div class="ds"><div class="dl">🔗 관련 표현</div><div class="rc">${w.rel.map(r=>`<span class="rch">${r}</span>`).join('')}</div></div>`:''}
    </div>
  </div>`).join('');
}
function rmSv(e,w){e.stopPropagation();saved.delete(w);save();rdrSaved();}
function clrAll(){if(!saved.size)return;if(confirm(`저장된 단어 ${saved.size}개를 모두 삭제할까요?`)){saved.clear();save();rdrSaved();rdr();}}

function rdrQuiz(){
  const svW=W.filter(w=>saved.has(w.w));
  const qc=document.getElementById('qc');
  if(svW.length<4){qc.innerHTML=`<div class="qsetup"><h2>✏️ 퀴즈</h2><p>퀴즈는 저장된 단어<br><strong style="color:var(--ac)">${svW.length}개</strong> 중 최소 4개가 필요합니다.</p><button class="btn a" style="width:100%;margin-top:8px" onclick="sw('vocab')">단어장으로 →</button></div>`;return;}
  qc.innerHTML=`<div class="qsetup"><h2>✏️ 퀴즈</h2><p>저장된 <strong style="color:var(--ac)">${svW.length}개</strong> 단어로 시작!</p><div class="qm"><button class="btn a" onclick="startQ('ko')">🇰🇷 영어 → 한국어</button><button class="btn" style="background:var(--ac2);color:#000;border-color:var(--ac2);font-weight:700" onclick="startQ('en')">🇺🇸 한국어 → 영어</button><button class="btn" style="background:var(--ac3);color:#fff;border-color:var(--ac3);font-weight:700" onclick="startQ('nu')">💡 뉘앙스 맞히기</button></div></div>`;
}

let qst=null;
function startQ(mode){
  const svW=W.filter(w=>saved.has(w.w));
  const qs=shuf([...svW]).map(word=>{
    const wrong=shuf(W.filter(w=>w.w!==word.w)).slice(0,3);
    return{word,opts:shuf([word,...wrong]),mode};
  });
  qst={qs,cur:0,score:0,answered:false,mode};
  renderQ();
}

function optTxt(o,mode){
  if(mode==='ko')return o.ko;
  if(mode==='en')return o.w;
  return o.nu.substring(0,60)+'…';
}

function renderQ(){
  const{qs,cur,score}=qst;
  const qc=document.getElementById('qc');
  if(cur>=qs.length){
    const pct=Math.round(score/qs.length*100);
    const msg=pct>=80?'훌륭해요! 🎉':pct>=60?'잘 했어요! 👍':'더 연습해봐요! 💪';
    qc.innerHTML=`<div class="qres"><div style="font-size:13px;color:var(--mu);margin-bottom:4px">${msg}</div><div class="qsc">${score}<span style="font-size:22px;color:var(--mu)">/${qs.length}</span></div><p style="font-size:13px;color:var(--mu);margin:6px 0 18px">정답률 ${pct}%</p><button class="btn a" style="width:100%" onclick="startQ('${qst.mode}')">다시 풀기 🔁</button><div style="height:10px"></div><button class="btn" style="width:100%" onclick="rdrQuiz()">← 돌아가기</button></div>`;
    return;
  }
  const q=qs[cur];
  const prog=Math.round(cur/qs.length*100);
  const qTxt=q.mode==='ko'?`<div class="qw">${q.word.w}</div><div style="margin-top:4px"><button style="background:none;border:none;font-size:20px;cursor:pointer" onclick="spk2('${q.word.w}')">🔊</button></div><div class="qsub">${q.word.pron}</div>`
    :q.mode==='en'?`<div class="qw" style="font-size:19px">${q.word.ko}</div>`
    :`<div style="font-size:12px;color:var(--mu);line-height:1.6;max-width:280px">"${q.word.nu.substring(0,70)}…"</div><div class="qsub" style="margin-top:8px">어떤 단어일까요?</div>`;
  qc.innerHTML=`<div class="pb"><div class="pf" style="width:${prog}%"></div></div>
    <div class="qcard"><div class="qpt">${cur+1} / ${qs.length} · 점수 ${score}</div>${qTxt}</div>
    <div class="qopts">${q.opts.map((o,i)=>`<button class="qob" id="qo${i}" onclick="ansQ(${i},${q.opts.indexOf(q.word)})">${optTxt(o,q.mode)}</button>`).join('')}</div>`;
}

function spk2(w){const u=new SpeechSynthesisUtterance(w);u.lang='en-US';u.rate=0.85;window.speechSynthesis.cancel();window.speechSynthesis.speak(u);}

function ansQ(sel,ci){
  if(qst.answered)return;
  qst.answered=true;
  document.getElementById('qo'+ci).classList.add('ok');
  if(sel!==ci)document.getElementById('qo'+sel).classList.add('no');
  else qst.score++;
  setTimeout(()=>{qst.cur++;qst.answered=false;renderQ();},900);
}

function sw(tab){
  ['vocab','saved','quiz'].forEach((t,i)=>{
    document.getElementById('pnl-'+t).classList.toggle('on',t===tab);
    document.querySelectorAll('.tb')[i].classList.toggle('on',t===tab);
  });
  if(tab==='saved')rdrSaved();
  if(tab==='quiz')rdrQuiz();
}

shuf(pool);filt=[...pool];rdr();save();
</script>
